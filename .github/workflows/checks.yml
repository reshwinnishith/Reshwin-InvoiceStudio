name: Invoice Studio checks
on:
  push:
    branches: [fix/ios-navigation-invoice-reliability]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/smoke.cjs
