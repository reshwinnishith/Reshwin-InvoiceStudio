name: Invoice Studio checks
on:
  push:
    branches: [main, feat/release-1-1-safety-firebase-readiness]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check pdf.js
      - run: node --check core.js
      - run: node --check invoice-view.js
      - run: node --check smartimport.js
      - run: node --check smartimport-ui.js
      - run: node --check cloud.mjs
      - run: node --check boot.mjs
      - run: node tests/core.test.cjs
      - run: node tests/smoke.cjs
      - run: node tests/invoice-view.test.cjs
      - run: npm ci --ignore-scripts
      - run: node tests/vendor.test.cjs
      - run: npm run test:smartimport
